          mk**r -p \
            "${RESULTS_DIR**TORY}" \
            "${TEST_RESU**S_DIRECTORY}" \
            "${CO**RAGE_DIRECTORY}" \
            "$**UBLISH_DIRECTORY}"

      - name:**estore dependencies in locked mod**        env:
          BUILD_TARG**: ${{ steps.target.outputs.build-**rget }}
        run: |
