          dotnet "${ARGS[@]}"

      - name: Test component with coverage
        if: ${{ inputs.run_tests && inputs.collect_coverage }}
        env:
          BUILD_TARGET: ${{ steps.target.outputs.build-target }}
        run: |
          set -euo pipefail

          dotnet test \
            "${BUILD_TARGET}" \
            --configuration "${CONFIGURATION}" \
            --no-build \
            --logger "trx" \
            --results-directory "${TEST_RESULTS_DIRECTORY}" \
            --collect "XPlat Code Coverage" \
            -- \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Test component without coverage
        if: ${{ inputs.run_tests && !inputs.collect_coverage }}
        env:
          BUILD_TARGET: ${{ steps.target.outputs.build-target }}
        run: |
          set -euo pipefail

          dotnet test \
            "${BUILD_TARGET}" \
            --configuration "${CONFIGURATION}" \
            --no-build \
            --logger "trx" \
            --results-directory "${TEST_RESULTS_DIRECTORY}"

      - name: Validate test evidence
        if: ${{ inputs.run_tests }}
        run: |
          set -euo pipefail

          mapfile -t RESULT_FILES < <(
            find "${TEST_RESULTS_DIRECTORY}" \
              -type f \
              -name "*.trx" \
              | sort
          )

          if [[ "${#RESULT_FILES[@]}" -eq 0 ]]; then
            echo "::error::Tests were enabled, but no TRX result was generated."
            exit 1
          fi

          echo "TRX result files: ${#RESULT_FILES[@]}"

      - name: Collect coverage evidence
        if: ${{ inputs.run_tests && inputs.collect_coverage }}
        run: |
          set -euo pipefail

          mapfile -t COVERAGE_FILES < <(
            find "${TEST_RESULTS_DIRECTORY}" \
              -type f \
              -name "coverage.cobertura.xml" \
              | sort
          )

          if [[ "${#COVERAGE_FILES[@]}" -eq 0 ]]; then
            echo "::error::Coverage was enabled, but no Cobertura report was generated."
            echo "::error::Ensure the test projects reference coverlet.collector."
            exit 1
          fi

          for INDEX in "${!COVERAGE_FILES[@]}"; do
            cp \
              "${COVERAGE_FILES[${INDEX}]}" \
              "${COVERAGE_DIRECTORY}/coverage-${INDEX}.cobertura.xml"
          done

          echo "Coverage files: ${#COVERAGE_FILES[@]}"

      - name: Publish component
        env:
          BUILD_TARGET: ${{ steps.target.outputs.build-target }}
        run: |
          set -euo pipefail

          case "${BUILD_TARGET}" in
            *.csproj|*.fsproj|*.vbproj)
              dotnet publish \
                "${BUILD_TARGET}" \
                --configuration "${CONFIGURATION}" \
                --no-build \
                --output "${PUBLISH_DIRECTORY}"
              ;;

            *.sln|*.slnx)
              echo "Solution target detected."
              echo "Generic publish is skipped for solution targets."
              echo "The Dockerfile must publish the intended deployable project."
              ;;

            *)
              echo "::error::Unsupported build target: ${BUILD_TARGET}"
              exit 1
              ;;
          esac

      - name: Generate .NET CI metadata
        if: ${{ always() }}
        env:
          BUILD_TARGET: ${{ steps.target.outputs.build-target }}
          TIER: ${{ inputs.tier }}
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
          SDK_SOURCE: ${{ steps.sdk.outputs.source }}
          GLOBAL_JSON: ${{ steps.sdk.outputs.global-json }}
          RUN_TESTS: ${{ inputs.run_tests }}
          COLLECT_COVERAGE: ${{ inputs.collect_coverage }}
          WARNINGS_AS_ERRORS: ${{ inputs.treat_warnings_as_errors }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "schema_version": 1,
              "repository": os.environ["REPOSITORY"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "component": {
                  "name": os.environ["COMPONENT_NAME"],
                  "path": os.environ["COMPONENT_PATH"],
                  "tier": int(os.environ["TIER"]),
              },
              "dotnet": {
                  "sdk": os.environ["SDK_VERSION"],
                  "sdk_source": os.environ["SDK_SOURCE"],
                  "global_json": os.environ["GLOBAL_JSON"],
                  "configuration": os.environ["CONFIGURATION"],
                  "build_target": os.environ["BUILD_TARGET"],
                  "locked_restore": True,
                  "run_tests": (
                      os.environ["RUN_TESTS"].lower() == "true"
                  ),
                  "collect_coverage": (
                      os.environ["COLLECT_COVERAGE"].lower() == "true"
                  ),
                  "warnings_as_errors": (
                      os.environ["WARNINGS_AS_ERRORS"].lower() == "true"
                  ),
              },
              "workflow": {
                  "run_id": os.environ["RUN_ID"],
                  "run_attempt": os.environ["RUN_ATTEMPT"],
                  "job_status": os.environ["JOB_STATUS"],
              },
          }

          output = (
              Path(os.environ["RESULTS_DIRECTORY"])
              / "dotnet-ci-metadata.json"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          output.write_text(
              json.dumps(
                  metadata,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload .NET CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@<APPROVED_FULL_SHA>
        with:
          name: ${{ inputs.component_name }}-dotnet-ci-evidence
          retention-days: ${{ inputs.evidence_retention_days }}
          if-no-files-found: warn
          path: |
            .ci-results/dotnet/dotnet-ci-metadata.json
            .ci-results/dotnet/tests/**/*.trx
            .ci-results/dotnet/coverage/**/*.xml

      - name: Upload published component
        if: ${{ success() }}
        uses: actions/upload-artifact@<APPROVED_FULL_SHA>
        with:
          name: ${{ inputs.component_name }}-dotnet-publish
          retention-days: ${{ inputs.evidence_retention_days }}
          if-no-files-found: ignore
          path: |
            .ci-results/dotnet/publish/**

      - name: Expose .NET CI outputs
        id: outputs
        if: ${{ success() }}
        env:
          ARTIFACT_NAME: ${{ inputs.component_name }}-dotnet-publish
        run: |
          set -euo pipefail

          echo "result=PASS" >> "${GITHUB_OUTPUT}"
          echo "artifact-name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Generate .NET CI summary
        if: ${{ always() }}
        env:
          BUILD_TARGET: ${{ steps.target.outputs.build-target }}
          TIER: ${{ inputs.tier }}
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
          SDK_SOURCE: ${{ steps.sdk.outputs.source }}
          GLOBAL_JSON: ${{ steps.sdk.outputs.global-json }}
          RUN_TESTS: ${{ inputs.run_tests }}
          COLLECT_COVERAGE: ${{ inputs.collect_coverage }}
          WARNINGS_AS_ERRORS: ${{ inputs.treat_warnings_as_errors }}
        run: |
          {
            echo "## .NET Component CI"
            echo
            echo "| Configuration | Value |"
            echo "|---|---|"
            echo "| Component | \`${COMPONENT_NAME}\` |"
            echo "| Component path | \`${COMPONENT_PATH}\` |"
            echo "| Tier | ${TIER} |"
            echo "| Build target | \`${BUILD_TARGET}\` |"
            echo "| SDK | \`${SDK_VERSION}\` |"
            echo "| SDK source | \`${SDK_SOURCE}\` |"
            echo "| global.json | \`${GLOBAL_JSON}\` |"
            echo "| Configuration | \`${CONFIGURATION}\` |"
            echo "| NuGet lock files | Required |"
            echo "| Restore mode | \`--locked-mode\` |"
            echo "| Tests | ${RUN_TESTS} |"
            echo "| Coverage | ${COLLECT_COVERAGE} |"
            echo "| Warnings as errors | ${WARNINGS_AS_ERRORS} |"
          } >> "${GITHUB_STEP_SUMMARY}"