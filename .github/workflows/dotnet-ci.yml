name: Reusable .NET Component CI

on:
  workflow_call:
    inputs:
      component_name:
        description: "Component name from components.yml"
        required: true
        type: string

      component_path:
        description: "Repository-relative component directory"
        required: true
        type: string

      tier:
        description: "Component Tier: 1, 2 or 3"
        required: true
        type: number

      dotnet_version:
        description: "Fallback .NET SDK version when global.json is absent"
        required: false
        type: string
        default: "10.0.x"

      project_file:
        description: "Optional repository-relative solution or project file"
        required: false
        type: string
        default: ""

      configuration:
        description: "Build configuration"
        required: false
        type: string
        default: "Release"

      run_tests:
        description: "Run dotnet test"
        required: false
        type: boolean
        default: true

      collect_coverage:
        description: "Collect XPlat Code Coverage in Cobertura format"
        required: false
        type: boolean
        default: true

      treat_warnings_as_errors:
        description: "Treat compiler warnings as errors"
        required: false
        type: boolean
        default: true

      evidence_retention_days:
        description: "Evidence artifact retention period"
        required: false
        type: number
        default: 30

    outputs:
      result:
        description: "Technology CI result"
        value: ${{ jobs.dotnet-ci.outputs.result }}

      build_target:
        description: "Solution or project used by the build"
        value: ${{ jobs.dotnet-ci.outputs.build-target }}

      artifact_name:
        description: "Published component artifact name"
        value: ${{ jobs.dotnet-ci.outputs.artifact-name }}

      dotnet_version:
        description: ".NET SDK version used"
        value: ${{ jobs.dotnet-ci.outputs.dotnet-version }}

permissions:
  contents: read

jobs:
  dotnet-ci:
    name: "${{ inputs.component_name }} / .NET CI"

    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      result: ${{ steps.outputs.outputs.result }}
      build-target: ${{ steps.target.outputs.build-target }}
      artifact-name: ${{ steps.outputs.outputs.artifact-name }}
      dotnet-version: ${{ steps.sdk.outputs.version }}

    defaults:
      run:
        shell: bash

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
      NUGET_XMLDOC_MODE: "skip"

      COMPONENT_NAME: ${{ inputs.component_name }}
      COMPONENT_PATH: ${{ inputs.component_path }}
      CONFIGURATION: ${{ inputs.configuration }}

      RESULTS_DIRECTORY: ${{ github.workspace }}/.ci-results/dotnet
      TEST_RESULTS_DIRECTORY: ${{ github.workspace }}/.ci-results/dotnet/tests
      COVERAGE_DIRECTORY: ${{ github.workspace }}/.ci-results/dotnet/coverage
      PUBLISH_DIRECTORY: ${{ github.workspace }}/.ci-results/dotnet/publish

    steps:
      - name: Validate .NET CI inputs
        env:
          TIER: ${{ inputs.tier }}
          FALLBACK_DOTNET_VERSION: ${{ inputs.dotnet_version }}
          PROJECT_FILE: ${{ inputs.project_file }}
          RETENTION_DAYS: ${{ inputs.evidence_retention_days }}
        run: |
          set -euo pipefail

          if [[ ! "${COMPONENT_NAME}" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::Invalid component_name '${COMPONENT_NAME}'."
            exit 1
          fi

          if [[ -z "${COMPONENT_PATH}" ]]; then
            echo "::error::component_path cannot be empty."
            exit 1
          fi

          if [[ "${COMPONENT_PATH}" == /* ]]; then
            echo "::error::component_path must be repository-relative."
            exit 1
          fi

          if [[ "${COMPONENT_PATH}" == *".."* ]]; then
            echo "::error::Parent traversal is not allowed in component_path."
            exit 1
          fi

          if [[ -n "${PROJECT_FILE}" ]]; then
            if [[ "${PROJECT_FILE}" == /* ]]; then
              echo "::error::project_file must be repository-relative."
              exit 1
            fi

            if [[ "${PROJECT_FILE}" == *".."* ]]; then
              echo "::error::Parent traversal is not allowed in project_file."
              exit 1
            fi
          fi

          case "${TIER}" in
            1|2|3)
              ;;
            *)
              echo "::error::In*alid Tier '${TIER}'."
            * exit 1
              ;;
         *esac

          case "${CONFIGURAT*ON}" in
            Debug|Release)*              ;;
            *)
  *           echo "::error::Unsuppor*ed build configuration '${CONFIGUR*TION}'."
              exit 1
    *         ;;
          esac

      *   if [[ -z "${FALLBACK_DOTNET_VERSION}" ]]; then
            echo ":*error::dotnet_version fallback can*ot be empty."
            exit 1
 *        fi

          if ! [[ "${RETENTION_DAYS}" =~ ^[0-9]+$ ]]; the*
            echo "::error::eviden*e_retention_days must be numeric."*            exit 1
          fi

 *        if [[ "${RETENTION_DAYS}" -lt 1 || "${RETENTION_DAYS}" -gt 90 ]]; then
            echo "::error*:evidence_retention_days must be b*tween 1 and 90."
            exit *
          fi

